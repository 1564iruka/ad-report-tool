<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>廣告週報生成小工具 v8.0</title>
    <style>
        :root { --g-blue: #1a73e8; --g-gray: #5f6368; --bg: #f8f9fa; --border: #dadce0; --success: #34a853; --danger: #d93025; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); margin: 0; display: flex; flex-direction: column; height: 100vh; }
        header { background: white; padding: 12px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        header h1 { margin: 0; font-size: 18px; color: var(--g-blue); }
        main { display: flex; flex: 1; padding: 20px; gap: 20px; overflow: hidden; }
        .card { background: white; border-radius: 8px; border: 1px solid var(--border); display: flex; flex-direction: column; flex: 1; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .card-header { padding: 12px 20px; border-bottom: 1px solid var(--border); background: #f1f3f4; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .content { padding: 20px; overflow-y: auto; flex: 1; }
        .input-group { margin-bottom: 12px; }
        label { display: block; font-size: 12px; color: var(--g-gray); margin-bottom: 4px; font-weight: bold; }
        input, textarea, select { width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        .metric-selector { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; background: #fff; padding: 10px; border: 1px solid var(--border); border-radius: 4px; margin-bottom: 10px; }
        .metric-item { display: flex; align-items: center; font-size: 13px; cursor: pointer; }
        .metric-item input { width: auto; margin-right: 8px; }
        .builder-box { background: #e8f0fe; padding: 15px; border-radius: 6px; border: 1px solid #c1d5fa; margin-top: 15px; }
        #preview { white-space: pre-wrap; font-size: 14px; line-height: 1.7; color: #3c4043; background: white; padding: 20px; border-radius: 4px; border: 1px solid #ddd; min-height: 500px; }
        .btn { background: var(--g-blue); color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-save { background: var(--success); font-size: 12px; padding: 5px 10px; }
        .btn-delete { background: var(--danger); font-size: 12px; padding: 5px 10px; margin-left: 5px; }
        .btn-add { background: var(--g-blue); margin-top: 10px; width: 100%; border-radius: 20px; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <header>
        <h1>🚀 廣告優化週報生成器 v8.0</h1>
        <div style="display:flex; align-items:center;">
            <select id="templateLoader" style="width: 180px;" onchange="loadTemplate()">
                <option value="">載入客戶範本...</option>
            </select>
            <button class="btn btn-delete" onclick="deleteTemplate()">❌ 刪除此範本</button>
        </div>
    </header>
    <main>
        <div class="card">
            <div class="card-header">
                數據設定
                <button class="btn btn-save" onclick="saveTemplate()">💾 儲存/覆蓋範本</button>
            </div>
            <div class="content">
                <div class="row" style="display:flex; gap:10px;">
                    <div class="input-group" style="flex:1;"><label>收件人 (Hi ...)</label><input type="text" id="recipient" oninput="run()"></div>
                    <div class="input-group" style="flex:1;"><label>客戶名稱</label><input type="text" id="client" oninput="run()"></div>
                </div>
                <div class="row" style="display:flex; gap:10px;">
                    <div class="input-group" style="flex:1;"><label>平台</label><select id="platform" onchange="run()"><option>Google PMax</option><option>Google GDN</option><option>Google KWS</option><option>Meta</option><option>LINE</option></select></div>
                    <div class="input-group" style="flex:1;"><label>開始日期</label><input type="date" id="sDate" onchange="run()"></div>
                    <div class="input-group" style="flex:1;"><label>結束日期</label><input type="date" id="eDate" onchange="run()"></div>
                </div>

                <label style="color:var(--g-blue)">1. 選擇顯示欄位</label>
                <div class="metric-selector">
                    <label class="metric-item"><input type="checkbox" class="m-check" value="imp" checked onchange="toggleInputs()"> 曝光次數</label>
                    <label class="metric-item"><input type="checkbox" class="m-check" value="click" checked onchange="toggleInputs()"> 點擊次數</label>
                    <label class="metric-item"><input type="checkbox" class="m-check" value="conv" checked onchange="toggleInputs()"> 轉換數</label>
                    <label class="metric-item"><input type="checkbox" class="m-check" value="ctr" onchange="toggleInputs()"> CTR</label>
                    <label class="metric-item"><input type="checkbox" class="m-check" value="cpc" onchange="toggleInputs()"> CPC</label>
                    <label class="metric-item"><input type="checkbox" class="m-check" value="cpa" onchange="toggleInputs()"> CPA</label>
                    <label class="metric-item"><input type="checkbox" class="m-check" value="spend" checked onchange="toggleInputs()"> 花費</label>
                    <label class="metric-item"><input type="checkbox" class="m-check" value="progress" onchange="toggleInputs()"> 花費進度</label>
                </div>

                <div class="metric-inputs" id="inputContainer" style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                    <div id="div-imp" class="input-group"><label>曝光</label><input type="text" id="v-imp" oninput="run()"></div>
                    <div id="div-click" class="input-group"><label>點擊</label><input type="text" id="v-click" oninput="run()"></div>
                    <div id="div-conv" class="input-group"><label>轉換</label><input type="text" id="v-conv" oninput="run()"></div>
                    <div id="div-ctr" class="input-group hidden"><label>CTR (%)</label><input type="text" id="v-ctr" oninput="run()"></div>
                    <div id="div-cpc" class="input-group hidden"><label>CPC</label><input type="text" id="v-cpc" oninput="run()"></div>
                    <div id="div-cpa" class="input-group hidden"><label>CPA</label><input type="text" id="v-cpa" oninput="run()"></div>
                    <div id="div-spend" class="input-group"><label>花費</label><input type="text" id="v-spend" oninput="run()"></div>
                    <div id="div-progress" class="input-group hidden"><label>花費進度 (%)</label><input type="text" id="v-progress" oninput="run()"></div>
                </div>

                <div class="builder-box">
                    <label style="color:var(--g-blue)">2. 優化說明生成器</label>
                    <div class="row" style="display:flex; gap:10px;">
                        <select id="obsType" style="flex:0.4;">
                            <option>轉換數</option><option>搜尋字詞</option><option>點擊成本</option><option>搜尋關鍵字</option>
                            <option>曝光比重</option><option>客層表現</option><option>點閱率</option><option>素材表現</option>
                        </select>
                        <input type="text" id="obsInput" placeholder="輸入狀況..." style="flex:0.6;">
                    </div>
                    <button class="btn btn-add" onclick="addObs()">✨ 生成並累加說明</button>
                </div>

                <div class="input-group" style="margin-top:15px;">
                    <label>說明內容彙整 (自動累加)</label>
                    <textarea id="obsFinal" rows="5" oninput="run()"></textarea>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">最終報表預覽 <button class="btn" onclick="copy()">複製</button></div>
            <div class="content" style="background: #f1f3f4;"><div id="preview"></div></div>
        </div>
    </main>

    <script>

                pos: ["針對素材表現進行評估，本週「${val}」成效顯著，建議後續可延續此風格優化。", "素材回饋正向，特別是「${val}」表現優於平均，為本週帳戶的主要成長動能。", "觀察素材成效，本週以「${val}」帶入的點擊最為精準，將持續維持該類型素材投放。", "本週素材測試表現優異，${val}成功突破原有的點閱瓶頸，帶動整體的視覺吸引力。", "素材交互數據顯示，${val}在多個版位皆有穩定轉化，顯示該溝通主軸能引起受眾行動。"],

            }
        };

        const metricNames = { imp: "曝光次數", click: "點擊次數", conv: "轉換數", ctr: "CTR", cpc: "CPC", cpa: "CPA", spend: "花費", progress: "花費進度" };

        function toggleInputs() {
            document.querySelectorAll('.m-check').forEach(ck => {
                const div = document.getElementById('div-' + ck.value);
                ck.checked ? div.classList.remove('hidden') : div.classList.add('hidden');
            });
            run();
        }

        function formatVal(val, type) {
            if (!val || isNaN(val.replace(/,/g, ''))) return val || '0';
            const num = parseFloat(val.replace(/,/g, ''));
            const formatted = new Intl.NumberFormat('zh-TW').format(num);
            if(['spend', 'cpa', 'cpc'].includes(type)) return '$' + formatted;
            if(['ctr', 'progress'].includes(type)) return formatted + '%';
            return formatted;
        }

        function addObs() {
            const type = document.getElementById('obsType').value;
            const input = document.getElementById('obsInput').value;
            if(!input) return;

            const neuWords = ["持平", "穩定", "不大", "維持", "平穩", "無變化"];
            const isNeu = neuWords.some(w => input.includes(w));
            
            let tone = "neu";
            if (!isNeu) {
                const isUp = input.includes("上升") || input.includes("提升") || input.includes("增加");
                const isDown = input.includes("下降") || input.includes("下滑") || input.includes("減少");
                tone = (type === "點擊成本") ? (isDown ? "pos" : "neg") : (isUp ? "pos" : "neg");
            }
            
            const pool = db[type][tone];
            const sentence = pool[Math.floor(Math.random() * pool.length)].replace('${val}', input);
            const current = document.getElementById('obsFinal').value;
            document.getElementById('obsFinal').value = current + (current ? '\n\n' : '') + sentence;
            document.getElementById('obsInput').value = '';
            run();
        }

        function saveTemplate() {
            const client = document.getElementById('client').value;
            if(!client) return alert('請先輸入客戶名稱才能儲存範本');
            const checks = [];
            document.querySelectorAll('.m-check').forEach(ck => { if(ck.checked) checks.push(ck.value); });
            const template = { platform: document.getElementById('platform').value, checks: checks };
            // Overwrites automatically if key exists
            localStorage.setItem('tpl_' + client, JSON.stringify(template));
            updateTemplateLoader();
            alert(`範本 [${client}] 已更新！`);
        }

        function deleteTemplate() {
            const client = document.getElementById('templateLoader').value;
            if(!client) return alert('請先在右側選擇要刪除的範本');
            if(confirm(`確定要刪除 [${client}] 的範本嗎？`)) {
                localStorage.removeItem('tpl_' + client);
                updateTemplateLoader();
                alert('範本已刪除');
            }
        }

        function updateTemplateLoader() {
            const loader = document.getElementById('templateLoader');
            loader.innerHTML = '<option value="">載入客戶範本...</option>';
            for(let i=0; i<localStorage.length; i++) {
                const key = localStorage.key(i);
                if(key.startsWith('tpl_')) {
                    const name = key.replace('tpl_', '');
                    const opt = document.createElement('option');
                    opt.value = name; opt.innerText = name;
                    loader.appendChild(opt);
                }
            }
        }

        function loadTemplate() {
            const client = document.getElementById('templateLoader').value;
            if(!client) return;
            const data = JSON.parse(localStorage.getItem('tpl_' + client));
            document.getElementById('client').value = client;
            document.getElementById('platform').value = data.platform;
            document.querySelectorAll('.m-check').forEach(ck => { ck.checked = data.checks.includes(ck.value); });
            toggleInputs();
        }

        function run() {
            const get = (id) => document.getElementById(id).value;
            const sD = get('sDate').replace(/-/g, '/') || '____/__/__';
            const eD = get('eDate').replace(/-/g, '/') || '____/__/__';
            let perfArray = [];
            document.querySelectorAll('.m-check:checked').forEach(ck => {
                let val = formatVal(document.getElementById('v-' + ck.value).value, ck.value);
                perfArray.push(`${metricNames[ck.value]} ${val}`);
            });
            const text = `Hi ${get('recipient') || '[收件人]'} ,\n\n附件為 ${get('client') || '[客戶]'} ${get('platform')} 廣告報表，請查閱，謝謝。\n\n【帳戶狀況說明】\n廣告成效走期 ${sD} - ${eD}\n廣告成效：${perfArray.join('、')}。\n\n【帳戶優化說明】\n${get('obsFinal') || '（請輸入優化內容）'}\n\nBest regards,`;
            document.getElementById('preview').innerText = text;
        }

        function copy() {
            navigator.clipboard.writeText(document.getElementById('preview').innerText);
            alert('已成功複製到剪貼簿！');
        }

        updateTemplateLoader();
        run();
    </script>

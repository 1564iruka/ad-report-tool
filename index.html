<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>廣告週報生成小工具 v26.0</title>
    <style>
        :root { --g-blue: #1a73e8; --g-gray: #5f6368; --bg: #f8f9fa; --border: #dadce0; --success: #34a853; --danger: #d93025; --accent: #673ab7; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); margin: 0; display: flex; flex-direction: column; height: 100vh; }
        header { background: white; padding: 12px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; box-shadow: 0 1px 2px rgba(0,0,0,0.1); z-index: 100; }
        header h1 { margin: 0; font-size: 18px; color: var(--g-blue); }
        .update-date { font-size: 10px; color: #9aa0a6; font-weight: normal; margin-top: 4px; display: block; }
        main { display: flex; flex: 1; padding: 20px; gap: 20px; overflow: hidden; }
        .card { background: white; border-radius: 8px; border: 1px solid var(--border); display: flex; flex-direction: column; flex: 1; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .card-header { padding: 12px 20px; border-bottom: 1px solid var(--border); background: #f1f3f4; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .content { padding: 20px; overflow-y: auto; flex: 1; }
        label { display: block; font-size: 11px; color: var(--g-gray); margin-bottom: 4px; font-weight: bold; text-transform: uppercase; }
        input[type="text"], input[type="date"], textarea, select { width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 4px; box-sizing: border-box; font-size: 13px; }
        .import-box { background: #fffde7; border: 1px dashed #fbc02d; padding: 12px; border-radius: 4px; margin-bottom: 15px; }
        .platform-selector { display: flex; flex-wrap: wrap; gap: 10px; padding: 8px 0; }
        .platform-item { display: flex; align-items: center; font-size: 12px; cursor: pointer; color: var(--g-gray); }
        .platform-item input { margin-right: 4px; width: auto; }
        .metric-selector { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; background: #fff; padding: 10px; border: 1px solid var(--border); border-radius: 4px; margin-bottom: 10px; }
        .metric-item { display: flex; align-items: center; font-size: 12px; cursor: pointer; color: var(--g-gray); }
        .metric-item input { width: auto; margin-right: 6px; }
        .builder-box { background: #e8f0fe; padding: 15px; border-radius: 6px; border: 1px solid #c1d5fa; margin-top: 15px; }
        .stage-box { background: #fff; padding: 10px; border: 1px solid var(--border); border-radius: 4px; margin-top: 10px; }
        #preview { white-space: pre-wrap; font-size: 13px; line-height: 1.6; color: #3c4043; background: white; padding: 20px; border-radius: 4px; border: 1px solid #ddd; min-height: 550px; }
        .btn { background: var(--g-blue); color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; }
        .btn-add { background: var(--accent); border-radius: 20px; flex: 1; margin-top: 8px; }
        .btn-outline { background: white; color: var(--g-gray); border: 1px solid var(--border); font-size: 11px; padding: 4px 8px; }
        .hidden { display: none; }
        .guide-box { font-size: 11px; color: #5f6368; background: rgba(255,255,255,0.6); padding: 8px; border-radius: 4px; margin-bottom: 10px; border: 1px solid #ddd; line-height: 1.5; }
        .guide-arrow { color: var(--g-blue); font-weight: bold; margin: 0 4px; }
        .guide-highlight { color: #d93025; font-weight: bold; }
    </style>
</head>
<body>
    <header>
        <div>
            <h1>廣告週報生成小工具 v26.0</h1>
            <span class="update-date">最後更新日期：2026/01/21</span>
        </div>
        <div style="display:flex; gap:10px; align-items:center;">
            <select id="templateLoader" style="width: 150px;" onchange="loadTemplate()"><option value="">載入客戶範本</option></select>
            <button class="btn btn-outline" onclick="exportTemplates()">🔗 匯出</button>
            <button class="btn btn-outline" onclick="importTemplates()">📥 匯入</button>
        </div>
    </header>
    <main>
        <div class="card">
            <div class="card-header">數據匯入與策略生成 <button class="btn" style="background:var(--success)" onclick="saveTemplate()">💾 儲存範本</button></div>
            <div class="content">
                <div class="import-box">
                    <label>⚡ 數據快速解析器 (貼入報表總計列)</label>
                    <textarea id="bulkPaste" rows="2" placeholder="貼入數據後，下方欄位將自動填入並勾選..." oninput="parseBulkData()"></textarea>
                </div>
                <div style="display:grid; grid-template-columns: 1fr 1.5fr; gap:10px; margin-bottom:10px;">
                    <div><label>收件人</label><input type="text" id="recipient" placeholder="Jennifer" oninput="run()"></div>
                    <div><label>客戶名稱</label><input type="text" id="client" value="" placeholder="客戶名稱..." oninput="run()"></div>
                </div>
                
                <div style="margin-bottom:10px;">
                    <label>投放平台 (可複選)</label>
                    <div class="platform-selector">
                        <label class="platform-item"><input type="checkbox" class="p-check" value="Google PMax" onchange="run()"> Google PMax</label>
                        <label class="platform-item"><input type="checkbox" class="p-check" value="Google GDN" onchange="run()"> Google GDN</label>
                        <label class="platform-item"><input type="checkbox" class="p-check" value="Google KWS" onchange="run()"> Google KWS</label>
                        <label class="platform-item"><input type="checkbox" class="p-check" value="Meta" onchange="run()"> Meta</label>
                        <label class="platform-item"><input type="checkbox" class="p-check" value="LINE" onchange="run()"> LINE</label>
                    </div>
                </div>

                <div style="display:flex; gap:10px; margin-bottom:10px;">
                    <div style="flex:1;"><label>開始日期</label><input type="date" id="sDate" onchange="run()"></div>
                    <div style="flex:1;"><label>結束日期</label><input type="date" id="eDate" onchange="run()"></div>
                </div>
                
                <label style="color:var(--g-blue)">1. 數據總覽欄位 (自動勾選)</label>
                <div class="metric-selector">
                    <label class="metric-item"><input type="checkbox" class="m-check" value="imp" onchange="toggleInputs()"> 曝光次數</label>
                    <label class="metric-item"><input type="checkbox" class="m-check" value="click" onchange="toggleInputs()"> 點擊次數</label>
                    <label class="metric-item"><input type="checkbox" class="m-check" value="conv" onchange="toggleInputs()"> 轉換數</label>
                    <label class="metric-item"><input type="checkbox" class="m-check" value="ctr" onchange="toggleInputs()"> CTR</label>
                    <label class="metric-item"><input type="checkbox" class="m-check" value="cpc" onchange="toggleInputs()"> 點擊成本 (CPC)</label>
                    <label class="metric-item"><input type="checkbox" class="m-check" value="cpa" onchange="toggleInputs()"> 轉換成本</label>
                    <label class="metric-item"><input type="checkbox" class="m-check" value="spend" onchange="toggleInputs()"> 花費</label>
                    <label class="metric-item"><input type="checkbox" class="m-check" value="progress" onchange="toggleInputs()"> 花費進度</label>
                </div>

                <div id="inputGrid" style="display:grid; grid-template-columns: repeat(4, 1fr); gap:8px;">
                    <div id="div-imp" class="input-group hidden"><label>曝光</label><input type="text" id="v-imp" oninput="autoCheck('imp'); run()"></div>
                    <div id="div-click" class="input-group hidden"><label>點擊</label><input type="text" id="v-click" oninput="autoCheck('click'); run()"></div>
                    <div id="div-conv" class="input-group hidden"><label>轉換</label><input type="text" id="v-conv" oninput="autoCheck('conv'); run()"></div>
                    <div id="div-ctr" class="input-group hidden"><label>CTR%</label><input type="text" id="v-ctr" oninput="autoCheck('ctr'); run()"></div>
                    <div id="div-cpc" class="input-group hidden"><label>CPC</label><input type="text" id="v-cpc" oninput="autoCheck('cpc'); run()"></div>
                    <div id="div-cpa" class="input-group hidden"><label>CPA</label><input type="text" id="v-cpa" oninput="autoCheck('cpa'); run()"></div>
                    <div id="div-spend" class="input-group hidden"><label>花費</label><input type="text" id="v-spend" oninput="autoCheck('spend'); run()"></div>
                    <div id="div-progress" class="input-group hidden"><label>進度%</label><input type="text" id="v-progress" oninput="autoCheck('progress'); run()"></div>
                </div>

                <div class="builder-box">
                    <label style="color:var(--accent)">🔍 優化分析生成器</label>
                    
                    <div class="guide-box">
                        <strong>💡 填寫指南：</strong><br>
                        1. 選擇分類 <b>[搜尋與關鍵字]</b> + 指標 <b>[點擊數]</b><br>
                        2. 輸入完整描述： <span class="guide-highlight">品牌字點擊大幅成長，顯示品牌聲量提升</span><br>
                        3. 輸出結果： <span class="guide-arrow">→</span> 觀察關鍵字表現，<b>品牌字點擊大幅成長，顯示品牌聲量提升</b> (100→150)，反映出核心字組策略成功...
                    </div>

                    <div style="display:flex; gap:8px; margin-bottom:8px;">
                        <select id="level1" style="flex:1;" onchange="updateLevel2()">
                            <option value="廣告整體方向">廣告整體方向</option>
                            <option value="素材與版位表現">素材與版位表現</option>
                            <option value="客層與受眾表現">客層與受眾表現</option>
                            <option value="搜尋與關鍵字分析">搜尋與關鍵字分析</option>
                            <option value="競品與外部環境">競品與外部環境</option>
                        </select>
                        <select id="level2" style="flex:1;">
                            </select>
                    </div>
                    
                    <div style="display:flex; gap:8px; margin-bottom:8px; background:rgba(255,255,255,0.5); padding:8px; border-radius:4px;">
                        <div style="flex:1;"><label style="font-size:9px;">前期數值</label><input type="text" id="comp_prev" placeholder="例如: 5.41"></div>
                        <div style="flex:1;"><label style="font-size:9px;">本期數值</label><input type="text" id="comp_this" placeholder="例如: 5.67"></div>
                    </div>

                    <input type="text" id="obsInput" placeholder="輸入完整描述 (如：A素材點閱率上升，吸引大量訪客)..." style="width:100%; margin-bottom:8px;">
                    
                    <div style="display:flex; gap:5px;">
                        <button class="btn btn-add" onclick="addStage('found')">加到本週發現</button>
                        <button class="btn btn-add" style="background:#ef6c00" onclick="addStage('executed')">加到本週已執行</button>
                        <button class="btn btn-add" style="background:#34a853" onclick="addStage('nextDirection')">加到下週調整方向</button>
                    </div>
                </div>
                <div class="stage-box"><label>【本週發現】</label><textarea id="stageFound" rows="2" oninput="run()"></textarea></div>
                <div class="stage-box"><label>【本週已執行】</label><textarea id="stageExecuted" rows="2" oninput="run()"></textarea></div>
                <div class="stage-box"><label>【下週調整方向】</label><textarea id="stageNextDirection" rows="2" oninput="run()"></textarea></div>
            </div>
        </div>
        <div class="card">
            <div class="card-header">最終報表預覽 <button class="btn" onclick="copy()">複製報表文字</button></div>
            <div class="content" style="background: #f1f3f4;"><div id="preview"></div></div>
        </div>
    </main>

                found: ["受外部環境影響，${val} ${comp}，反映出市場競價態勢與需求熱度之變動。", "觀察競品動態，${val} ${comp}，競爭對手之投放力道對我方成效產生些許影響。", "考量節慶檔期因素，${val} ${comp}，顯示市場整體流量搜量在此期間呈現特定規律。", "分析市場狀況，${val} ${comp}，顯示產業整體需求與競價成本呈現連動變化。"],
                executed: ["針對外部競價${val}之衝擊，本週已協助調配日預算走速以維持曝光佔比穩定。", "因應市場變化，本週已協助調整投放時段與出價模型，確保競爭優勢。", "針對市場${val}之現狀，本週已執行對應之備選優化方案，致力於穩定長期獲客效益。", "面對競品${val}之策略，本週已針對核心關鍵字進行防禦性出價調整。"],
                nextDirection: ["下週調整方向計畫規劃對應方案，以因應市場${val}所帶來之潛在波動風險。", "下週預計密切關注競品${val}之動向，並隨時準備調整預算佈局以捍衛版位。", "後續將針對節慶後${val}之市場回調狀況進行評估，並回歸常態之投遞邏輯。", "下週計畫針對外部環境${val}之變化進行策略沙盤推演，以確保廣告成效之穩定性。"]
            }
        };

        function updateLevel2() {
            const l1 = document.getElementById('level1').value;
            const l2 = document.getElementById('level2');
            l2.innerHTML = "";
            level2Options[l1].forEach(opt => l2.add(new Option(opt, opt)));
        }

        function formatCompVal(val, metric) {
            if (!val) return "";
            let clean = val.replace(/[$,%\s]/g, '').replace('NT', '');
            let num = parseFloat(clean);
            if (isNaN(num)) return val;
            let formatted = new Intl.NumberFormat('zh-TW').format(num);
            if (["成本", "花費", "費用", "CPC", "CPA", "單次點擊出價"].some(k => metric.includes(k))) return "$" + formatted;
            if (["點閱率", "進度", "CTR", "互動率", "花費進度"].some(k => metric.includes(k))) return formatted + "%";
            return formatted;
        }

        function autoCheck(key) {
            const ck = document.querySelector(`.m-check[value="${key}"]`);
            if (ck && !ck.checked) {
                ck.checked = true;
                toggleInputs();
            }
        }

        function addStage(s) {
            const l1 = document.getElementById('level1').value, l2 = document.getElementById('level2').value, input = document.getElementById('obsInput').value;
            if (!input) return;

            const curVal = document.getElementById('comp_this').value;
            const preVal = document.getElementById('comp_prev').value;
            let compStr = "";
            if (curVal && preVal) compStr = `(${formatCompVal(preVal, l2)} → ${formatCompVal(curVal, l2)})`;

            // v26.0 修正：不強制加入 l2 名稱，完全使用用戶輸入
            const pool = db[l1][s] || db[l1]["found"];
            const template = pool[Math.floor(Math.random() * pool.length)];
            const text = template.replace('${val}', input).replace('${comp}', compStr);

            const targetId = 'stage' + s.charAt(0).toUpperCase() + s.slice(1);
            const target = document.getElementById(targetId);
            target.value += (target.value ? '\n' : '') + text;
            
            document.getElementById('obsInput').value = "";
            document.getElementById('comp_this').value = "";
            document.getElementById('comp_prev').value = "";
            run();
        }

        function parseBulkData() {
            const raw = document.getElementById('bulkPaste').value.trim();
            if (!raw) return;
            const lines = raw.split(/\n/).map(line => line.split(/\t/));
            let data = lines.length < 2 ? raw.split(/\n/).map(line => line.trim().split(/\s{2,}/)) : lines;
            
            const h = data[0], v = data[data.length - 1];
            
            // v26.0 修正：確保點擊成本 (cpc) 與點擊次數 (click) 不會混淆
            const m = { 
                imp: { keys: ["曝光", "展示"], exclude: ["成本", "比重"] },
                click: { keys: ["點擊", "連結點擊"], exclude: ["成本", "出價", "率", "單次"] },
                conv: { keys: ["轉換", "成果", "名單"], exclude: ["成本", "率", "價值"] },
                ctr: { keys: ["CTR", "點閱率"], exclude: [] },
                cpc: { keys: ["平均單次點擊出價", "單次點擊成本", "CPC", "單次點擊花費"], exclude: [] },
                cpa: { keys: ["CPA", "成果成本", "轉換成本", "單次轉換費用"], exclude: [] },
                spend: { keys: ["花費", "金額", "Cost", "費用"], exclude: ["成本", "出價"] },
                progress: { keys: ["進度", "花費進度"], exclude: [] }
            };
            
            document.querySelectorAll('.m-check').forEach(ck => ck.checked = false);

            h.forEach((header, idx) => {
                for (let k in m) {
                    const rule = m[k];
                    if (rule.keys.some(key => header.includes(key)) && !rule.exclude.some(ex => header.includes(ex))) {
                        let val = v[idx];
                        if (val) {
                            document.getElementById('v-' + k).value = val.replace(/[$,%\s]/g, '').replace('NT', '');
                            document.querySelector(`.m-check[value="${k}"]`).checked = true;
                        }
                    }
                }
            });
            toggleInputs(); run();
        }

        function toggleInputs() {
            document.querySelectorAll('.m-check').forEach(ck => {
                const div = document.getElementById('div-' + ck.value);
                ck.checked ? div.classList.remove('hidden') : div.classList.add('hidden');
            });
            run();
        }

        function run() {
            const get = (id) => document.getElementById(id).value;
            const s = get('sDate').replace(/-/g, '/') || '__/__/__', e = get('eDate').replace(/-/g, '/') || '__/__/__';
            
            let platforms = [];
            document.querySelectorAll('.p-check:checked').forEach(p => platforms.push(p.value));
            const platformText = platforms.length > 0 ? platforms.join(' + ') : '[平台]';

            let perf = [];
            const labels = {imp:"曝光次數", click:"點擊次數", conv:"轉換數", ctr:"CTR", cpc:"CPC", cpa:"轉換成本", spend:"花費", progress:"花費進度"};
            document.querySelectorAll('.m-check:checked').forEach(ck => {
                perf.push(`${labels[ck.value]} ${formatCompVal(get('v-' + ck.value), labels[ck.value])}`);
            });
            document.getElementById('preview').innerText = `Hi ${get('recipient') || '[收件人]'} ,\n\n附件為 ${get('client') || '[客戶]'} ${platformText} 廣告報表，請查閱，謝謝。\n\n【帳戶狀況說明】\n廣告成效走期 ${s} - ${e}\n廣告成效：${perf.join('、')}。\n\n【帳戶優化說明】\n本週發現：\n${get('stageFound') || '無'}\n\n本週已執行：\n${get('stageExecuted') || '無'}\n\n下週調整方向：\n${get('stageNextDirection') || '無'}\n\nBest regards,`;
        }

        function saveTemplate() {
            const c = document.getElementById('client').value; if (!c) return alert('請輸入客戶名稱');
            const checks = Array.from(document.querySelectorAll('.m-check:checked')).map(ck => ck.value);
            const platforms = Array.from(document.querySelectorAll('.p-check:checked')).map(ck => ck.value);
            localStorage.setItem('tpl_v26_' + c, JSON.stringify({ platforms, checks }));
            updateLoader(); alert('範本儲存成功！');
        }
        function updateLoader() {
            const l = document.getElementById('templateLoader'); l.innerHTML = '<option value="">載入客戶範本</option>';
            Object.keys(localStorage).filter(k => k.startsWith('tpl_v26_')).forEach(k => l.add(new Option(k.replace('tpl_v26_',''), k.replace('tpl_v26_',''))));
        }
        function loadTemplate() {
            const c = document.getElementById('templateLoader').value; if (!c) return;
            const d = JSON.parse(localStorage.getItem('tpl_v26_'+c));
            document.getElementById('client').value = c; 
            document.querySelectorAll('.p-check').forEach(ck => ck.checked = false);
            if(d.platforms) d.platforms.forEach(p => { const el = document.querySelector(`.p-check[value="${p}"]`); if(el) el.checked = true; });
            document.querySelectorAll('.m-check').forEach(ck => ck.checked = d.checks.includes(ck.value));
            toggleInputs(); run();
        }
        function copy() { navigator.clipboard.writeText(document.getElementById('preview').innerText); alert('報表已複製！'); }
        function exportTemplates() { prompt("複製代碼分享：", JSON.stringify(Object.fromEntries(Object.keys(localStorage).filter(k => k.startsWith('tpl_v26_')).map(k => [k, localStorage.getItem(k)])))); }
        function importTemplates() { const j = prompt("貼入代碼："); if (j) { const d = JSON.parse(j); Object.keys(d).forEach(k => localStorage.setItem(k, d[k])); updateLoader(); alert('匯入成功'); run(); }}
        
        window.onload = () => { updateLevel2(); updateLoader(); run(); };
    </script>
</body>
</html>
